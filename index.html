<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Sized derivatives of public/icon.png. The source is 1254px / 244KB,
         which is far too heavy to hand a browser for a 16px tab slot. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1f3a" />
    <title>CPSM — Cement Plant Stock Management</title>
    <script>
      // Apply persisted theme before paint to avoid flash of wrong theme.
      (function () {
        try {
          var t = localStorage.getItem("cpsr.theme") || "system";
          var dark =
            t === "dark" ||
            (t === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
